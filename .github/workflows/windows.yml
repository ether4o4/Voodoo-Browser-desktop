name: Windows preview
on:
  pull_request:
  push:
    branches: [main, codex/desktop-mobile-parity]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:app
      - run: npm run package
      - name: Package preview
        shell: pwsh
        run: |
          Compress-Archive -Path 'dist/Voodoo Browser-win32-x64' -DestinationPath 'dist/Voodoo-Browser-windows-x64.zip' -CompressionLevel Fastest
          $hash = Get-FileHash -LiteralPath 'dist/Voodoo-Browser-windows-x64.zip' -Algorithm SHA256
          "$($hash.Hash.ToLower())  Voodoo-Browser-windows-x64.zip" | Set-Content -LiteralPath 'dist/SHA256SUMS.txt'
          @{version=(Get-Content package.json | ConvertFrom-Json).version; commit=$env:GITHUB_SHA; mobileSource='7a8f74cb9154a93d7ab8744b69ebe15091a9a51b'; ai='deferred'; platform='windows-x64'; signing='unsigned preview'; checks=@('npm ci','npm test','npm run test:app','npm run package')} | ConvertTo-Json | Set-Content -LiteralPath 'dist/build-evidence.json'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Voodoo-Windows-preview
          path: |
            dist/Voodoo-Browser-windows-x64.zip
            dist/SHA256SUMS.txt
            test-output/app-smoke.json
            test-output/home.png
            test-output/library.png
            test-output/workbench.png
            test-output/failure.png
            dist/build-evidence.json
      - name: Publish verified rolling preview
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/codex/desktop-mobile-parity' || github.ref == 'refs/heads/main')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $branch = $env:GITHUB_REF_NAME
          $head = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/heads/$branch" --jq '.object.sha'
          if ($LASTEXITCODE -ne 0 -or $head -ne $env:GITHUB_SHA) { throw 'A newer source commit exists; do not replace the rolling download.' }
          $notes = @"
          Windows preview 0.2.0: mobile script workbench, Magic script discovery, saved/automatic/manual activation, isolated userscript APIs, source review, updates, rollback, encrypted script values, writing archive, and the mobile home/globe UI. AI is deferred.

          Extract the entire ZIP and open Voodoo.exe. Existing Windows data is kept. This is an unsigned preview. Wi-Fi linking continues to share selected favorites, note snapshots and tabs; scripts and website credentials are not synchronized. Automated checks cover the actual Windows app, isolation, activation, persistence and device-link shutdown. Physical phone/PC pairing and arbitrary third-party scripts still need device testing.

          Source: $env:GITHUB_SHA
          "@
          $notes | Set-Content -LiteralPath 'dist/release-notes.md'
          gh release view desktop-preview *> $null
          if ($LASTEXITCODE -ne 0) { gh release create desktop-preview --target $env:GITHUB_SHA --title 'Windows preview 0.2.0 — rolling update' --notes-file dist/release-notes.md --prerelease }
          if ($LASTEXITCODE -ne 0) { throw 'Could not prepare the rolling release.' }
          gh release upload desktop-preview dist/Voodoo-Browser-windows-x64.zip dist/SHA256SUMS.txt dist/build-evidence.json test-output/app-smoke.json --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload the verified build.' }
          gh api --method PATCH "repos/$env:GITHUB_REPOSITORY/git/refs/tags/desktop-preview" -f sha=$env:GITHUB_SHA -F force=true
          if ($LASTEXITCODE -ne 0) { throw 'Could not move the rolling release tag to its verified source.' }
          gh release edit desktop-preview --title 'Windows preview 0.2.0 — rolling update' --notes-file dist/release-notes.md --prerelease
          if ($LASTEXITCODE -ne 0) { throw 'Could not update release notes.' }
